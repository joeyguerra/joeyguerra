pipeline:
  name: joeyguerra-website

on:
  push:
    branches: [main]
  manual: true

runner:
  labels: []
  fallback: any

jobs:
  install:
    mode: shell
    commands:
      - bun install --frozen-lockfile

  test:
    mode: shell
    commands:
      - bun test --pass-with-no-tests
    depends_on: [install]

  build:
    mode: shell
    depends_on: [test]
    on:
      push:
        branches: [main]
    commands:
      - |
        SHA=$(git rev-parse --short HEAD)
        docker build -t ${REGISTRY_HOST}/jbot-website:${SHA} .
        docker push ${REGISTRY_HOST}/jbot-website:${SHA}
        DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "${REGISTRY_HOST}/jbot-website:${SHA}" | sed 's/.*@//')
        echo "${DIGEST}" > /tmp/digest-jbot-website

  update-gitops:
    mode: shell
    depends_on: [build]
    on:
      push:
        branches: [main]
    commands:
      - |
        set -e
        DIGEST=$(cat /tmp/digest-jbot-website)
        rm -rf /tmp/mesh-gitops
        git -c http.sslVerify=false clone ${GITOPS_REPO_URL} /tmp/mesh-gitops
        sed -i "s|registry.local:5000/jbot-website[@:].*|registry.local:5000/jbot-website@${DIGEST}|g" /tmp/mesh-gitops/apps/joeyguerra/deployment.yaml
        git -C /tmp/mesh-gitops config user.email "ci@mesh"
        git -C /tmp/mesh-gitops config user.name "mesh-ci"
        git -C /tmp/mesh-gitops add apps/joeyguerra/deployment.yaml
        git -C /tmp/mesh-gitops diff --cached --quiet || git -C /tmp/mesh-gitops commit -m "ci: update jbot-website to $(printf '%.12s' "${DIGEST}")"
        git -C /tmp/mesh-gitops -c http.sslVerify=false pull --rebase origin main
        git -C /tmp/mesh-gitops -c http.sslVerify=false push origin main
