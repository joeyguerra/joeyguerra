<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation POC</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .buttons {
            display: flex;
            gap: 12px;
        }
        button {
            font-size: 1.2rem;
            padding: 12px 24px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 1.1rem;
            white-space: pre-line;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button data-high="false">Low Accuracy</button>
        <button data-high="true">High Accuracy (GPS)</button>
    </div>
    <div id="result"></div>
    <script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const result = document.getElementById('result');
                const highAccuracy = btn.dataset.high === 'true';
                if (!navigator.geolocation) {
                    result.textContent = 'Geolocation is not supported by this browser.';
                    return;
                }
                result.textContent = `Requesting location (${highAccuracy ? 'high' : 'low'} accuracy)...`;
                const start = performance.now();
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const elapsed = ((performance.now() - start) / 1000).toFixed(2);
                        result.textContent =
                            `Mode: ${highAccuracy ? 'High (GPS)' : 'Low (Wi-Fi/Cell)'}\n` +
                            `Latitude: ${pos.coords.latitude}\n` +
                            `Longitude: ${pos.coords.longitude}\n` +
                            `Accuracy: ${pos.coords.accuracy} meters\n` +
                            `Time: ${elapsed}s`;
                    },
                    (err) => {
                        console.error('Geolocation error:', err);
                        result.textContent = `Error (${err.code}): ${err.message}`;
                    },
                    {
                        enableHighAccuracy: highAccuracy,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        });
    </script>
</body>
</html>
