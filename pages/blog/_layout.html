<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{slot:title || Weblog }}</title>
  <link rel="stylesheet" href="/css/blog.css">
  {{slot:head}}
  <script>
    if (!['localhost', '127.0.0.1', ''].includes(location.hostname)) {
      var s = document.createElement('script');
      s.defer = true;
      s.src = 'https://analytics.joeyguerra.com/tracker.js';
      s.dataset.site = 'my-site';
      s.dataset.endpoint = 'https://analytics.joeyguerra.com/collect';
      document.currentScript.after(s);
    }
  </script>
  <!-- No-JS fallback -->
  <noscript>
    <img src="https://analytics.joeyguerra.com/pixel?s=joeyguerra_com&p=/"
         width="1" height="1" alt="">
  </noscript>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a href="/" class="site-name">Joey Guerra</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/blog" class="is-active">Weblog</a>
      </div>
    </nav>
  </header>
  <main class="main-content">
    {{content}}
  </main>
  <footer class="site-footer">
    <p>Words by Joey Guerra &mdash; <a href="https://github.com/joeyguerra/joeyguerra">source</a></p>
  </footer>
</body>
</html>
