apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: discoverycallrequests.joeyguerra.com
spec:
  group: joeyguerra.com
  names:
    kind: DiscoveryCallRequest
    listKind: DiscoveryCallRequestList
    plural: discoverycallrequests
    singular: discoverycallrequest
    shortNames:
      - dcr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [name, email, preferredDate, preferredTime, timezone]
              x-kubernetes-validations:
                - rule: "self.email.contains('@') && self.email.split('@')[1].contains('.')"
                  message: "email must contain '@' and a '.' in the domain"
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  minLength: 5
                  maxLength: 320
                company:
                  type: string
                  maxLength: 200
                preferredDate:
                  type: string
                  maxLength: 10
                preferredTime:
                  type: string
                  maxLength: 5
                timezone:
                  type: string
                  maxLength: 64
                notes:
                  type: string
                  maxLength: 2000
            status:
              type: object
              properties:
                delivered:
                  type: boolean
                deliveredAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: Email
          type: string
          jsonPath: .spec.email
        - name: Preferred
          type: string
          jsonPath: .spec.preferredDate
        - name: Delivered
          type: boolean
          jsonPath: .status.delivered
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jbot-website
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discovery-call-request-creator
  namespace: default
rules:
- apiGroups: ["joeyguerra.com"]
  resources: ["discoverycallrequests"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jbot-website-discovery-call-request-creator
  namespace: default
subjects:
- kind: ServiceAccount
  name: jbot-website
  namespace: default
roleRef:
  kind: Role
  name: discovery-call-request-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jbot-website
spec:
  selector:
    matchLabels:
      app: jbot-website
  replicas: 1
  template:
    metadata:
      labels:
        app: jbot-website
    spec:
      serviceAccountName: jbot-website
      containers:
      - name: jbot-website
        image: local/jbot-website:1234a14-1788109381683
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "8080"
        - name: NODE_ENV
          value: "production"
        - name: FRED_API_KEY
          valueFrom:
            secretKeyRef:
              name: fred-api-key
              key: FRED_API_KEY
        - name: HUBOT_DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: discord-token
              key: HUBOT_DISCORD_TOKEN
        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: cookie-secret
              key: COOKIE_SECRET
        - name: HUBOT_DISCOVERY_TOKEN
          valueFrom:
            secretKeyRef:
              name: hubot-discovery-token
              key: HUBOT_DISCOVERY_TOKEN
        - name: HUBOT_ALLOWED_ORIGINS
          value: "http://oplog-website:8080"
        - name: HUBOT_DISCOVERY_URL
          value: "ws://jbot-website-service:8080/discovery"
        - name: HUBOT_DISCOVERY_STORAGE
          value: ".data"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: jbot-website-service
spec:
  selector:
    app: jbot-website
  ports:
    - protocol: TCP
      port: 8080
